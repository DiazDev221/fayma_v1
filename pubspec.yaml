name: fayma
description: Gestion du crédit pour les boutiques de quartier (hors connexion d'abord).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0
  # Gestion d'état
  flutter_riverpod: ^2.5.1
  # Formats FCFA et dates (fr)
  intl: ^0.20.3
  # Import depuis le répertoire du téléphone
  flutter_contacts: ^1.1.9+2
  # Stockage local SQLite (Android, iOS, Linux, ...)
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # Ouvre l'application SMS avec le message pré-rempli
  url_launcher: ^6.3.0
  # Sauvegarde chiffrée : Argon2id + AES-GCM et partage
  cryptography: ^2.9.0
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  # Permission d'envoyer des SMS (Android)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Génération des icônes de lancement (outil de build uniquement)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/payment/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
          
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/fayma_icon.png"
  # Icône iOS pleine (sans coins transparents) : iOS applique lui-même
  # le masque arrondi, et l'App Store refuse les icônes avec canal alpha.
  image_path_ios: "assets/icon/fayma_icon_ios.png"
  remove_alpha_ios: true
  background_color_ios: "#0A3D2C"
  adaptive_icon_background: "#0A3D2C"
  adaptive_icon_foreground: "assets/icon/fayma_icon.png"